name: CI gate
description: Fails unless every job in `needs` succeeded.

inputs:
  needs:
    description: toJSON(needs) of the calling job.
    required: true

runs:
  using: composite
  steps:
    - name: Every job succeeded
      shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
      run: |
        echo "$NEEDS"
        jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
