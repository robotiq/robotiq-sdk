name: cmake-tests

# Reusable: configure, build and test one CMake project in Release.
on:
  workflow_call:
    inputs:
      source:
        description: The CMake source directory, from the repository root.
        required: true
        type: string
      os:
        description: The runners, as a JSON list.
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      cmake-args:
        description: Extra arguments to the configure step.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    # A hung pty test would otherwise hold the runner for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, test
        run: |
          cmake -S ${{ inputs.source }} -B build -DCMAKE_BUILD_TYPE=Release ${{ inputs.cmake-args }}
          cmake --build build --config Release -j 4
          ctest --test-dir build -C Release --output-on-failure --timeout 120
