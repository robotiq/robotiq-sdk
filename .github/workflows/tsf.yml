name: tsf

# No path filters: tsf-ci-gate is a required check on main, and a workflow
# skipped by a path filter would leave it pending on every PR that touches
# only another product.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# The TSF-85 tools live in tsf/ of robotiq-sdk: every run step starts there.
defaults:
  run:
    working-directory: tsf

jobs:
  # The example programs need a sensor. Windows has no pseudo-terminal, so
  # it runs only the unit tests that need none.
  sdk-cpp:
    uses: ./.github/workflows/cmake-tests.yml
    with:
      source: tsf/sdk_cpp
      cmake-args: -DTSF_BUILD_TESTS=ON

  # The Python tools on the oldest Python the launchers accept and on a
  # current one, on the three systems the launchers target (.sh, _mac.sh,
  # .bat): byte-compile everything, run the web viewer on synthetic data
  # (tools/smoke_web_viewer.py), then the unit tests.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the quickstart requirements
        run: python -m pip install -r sensor_quickstart/requirements.txt
      - name: Byte-compile
        run: python -m compileall -q sensor_quickstart firmware
      - name: Web viewer smoke test
        run: python sensor_quickstart/tools/smoke_web_viewer.py
      - name: Unit tests
        run: |
          python -m pip install pytest
          python -m pytest sensor_quickstart/tests -v

  # The one status check branch protection requires. Depends on every job
  # above: add new jobs here, never to the rule. `if: always()` makes it run
  # when a dependency failed; anything but success fails the gate.
  tsf-ci-gate:
    if: always()
    needs: [sdk-cpp, python]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
