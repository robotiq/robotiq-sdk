name: common

# No path filters: common-ci-gate is meant to be a required check on main, and
# a workflow skipped by a path filter would leave it pending.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # The pseudo-terminal tests skip themselves on Windows.
  tests:
    uses: ./.github/workflows/cmake-tests.yml
    with:
      source: common

  # The one build where robotiq_link_common() reuses a module.
  dev-aggregate:
    uses: ./.github/workflows/cmake-tests.yml
    with:
      source: dev
      os: '["ubuntu-latest"]'

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: git ls-files ':(glob)common/**/*.[ch]pp' | xargs clang-format --dry-run --Werror

  # The required check: add new jobs to needs, never to the rule.
  common-ci-gate:
    if: always()
    needs: [tests, dev-aggregate, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/ci-gate
        with:
          needs: ${{ toJSON(needs) }}
